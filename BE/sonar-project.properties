# SonarQube Project Configuration
# ================================

sonar.projectKey=vn-map-backend
sonar.projectName=VN Map Backend
sonar.projectVersion=1.0

# Source directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Binary directories (Maven output)
sonar.java.binaries=target/classes

# Encoding
sonar.sourceEncoding=UTF-8

# JaCoCo report path
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions - files not measured for coverage
# These are infrastructure/configuration files that don't need unit tests
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/*Application.java,\
  **/enums/**,\
  **/exception/*Exception.java,\
  **/mapper/**

# Duplicate code exclusions
sonar.cpd.exclusions=**/dto/**,**/model/**

# Analysis scope
sonar.scm.disabled=true
