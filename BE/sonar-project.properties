# ================================================================
# SonarQube / SonarCloud Project Configuration
# ================================================================

sonar.projectKey=vnm-backend
sonar.projectName=VN Map Backend
sonar.projectVersion=1.0

# Source directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Binary directories (Maven output)
sonar.java.binaries=target/classes

# Generated sources (MapStruct)
sonar.generated.coverage.sources=target/generated-sources/annotations

# Encoding
sonar.sourceEncoding=UTF-8

# JaCoCo report path
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# SonarQube server (use host.docker.internal for Docker on Windows/WSL)
sonar.host.url=http://host.docker.internal:9000

# Authentication token (for local SonarQube)
sonar.token=sqp_496560b296373d284d6335d12d6a3bcae337e175

# ================================================================
# Coverage exclusions — infrastructure/config that needs no tests
# ================================================================
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/*Application.java,\
  **/enums/**,\
  **/exception/*Exception.java,\
  **/mapper/**

# Duplicate code exclusions
sonar.cpd.exclusions=**/dto/**,**/model/**

# ================================================================
# Analysis scope
# ================================================================
sonar.scm.disabled=true
