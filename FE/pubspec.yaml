name: vietnamese_map
description: Vietnamese Map App - Flutter Clean Architecture
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3

  # Map
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.0
  flutter_map_marker_cluster: ^1.3.0
  latlong2: ^0.9.1

  # Code generation annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.2.7

  # Env config
  flutter_dotenv: ^5.1.0
  geolocator: ^14.0.2
  shared_preferences: ^2.2.3

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.69.0

  # Admin
  data_table_2: ^2.7.2

  # Firebase
  firebase_core: ^3.9.0
  firebase_analytics: ^11.3.0
  firebase_auth: ^5.3.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.2.0
  firebase_remote_config: ^5.1.0

  # Sentry (Web + Mobile crash reporting)
  sentry_flutter: ^8.1.0

  # Google Sign-In
  google_sign_in: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
