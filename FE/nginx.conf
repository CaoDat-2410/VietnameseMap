server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location ~* ^/(flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json|assetmanifest\.json|fontmanifest\.json|canvaskit/.*\.js)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /assets/.env {
    return 404;
  }

  location ~ (^|/)\. {
    return 404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}