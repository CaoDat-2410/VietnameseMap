# ================================================================
# SonarQube / SonarCloud Project Configuration - Flutter Frontend
# ================================================================

sonar.projectKey=vnm-frontend
sonar.projectName=VN Map Frontend
sonar.projectVersion=1.0

# Source directories
sonar.sources=lib

# Test directories
sonar.tests=test

# Flutter/Dart coverage (LCOV format)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Server URL (for local SonarQube)
sonar.host.url=http://localhost:9000

# ================================================================
# Coverage exclusions — infrastructure that needs no tests
# ================================================================
sonar.coverage.exclusions=\
  lib/main.dart,\
  lib/**/*_mock.dart,\
  lib/**/*_test.dart,\
  lib/generated/**,\
  lib/.env,\
  lib/**/*.g.dart

# Duplicate code exclusions
sonar.cpd.exclusions=lib/**/*_model.dart,lib/**/*_entity.dart

# ================================================================
# Analysis scope
# ================================================================
sonar.scm.disabled=true
